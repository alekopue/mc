# Chat Tags Configuration
name: "&9Tags:"
size: 54

# Should locked tags be shown in the menu?
showLockedTags: true

# Should a space be automatically added before a tag in chat?
# When true, e.g. format: "[Member] playerName [tag]"
# When false, e.g. format: "[Member] playerName[tag]"
addSpaceBeforeTag: true
# Should a space be automatically added after a tag in chat?
# When true, e.g. format: "[tag] text message"
# When false, e.g. format: "[tag]text message"
addSpaceAfterTag: false

items:
  filler:
    type: BLACK_STAINED_GLASS_PANE
    name: ' '
  '49':
    type: PAPER
    name: '&cReinicia tu tag.'
    action: RESET_TAG
  '53':
    type: OAK_DOOR
    name: '&cCerrar menu'
    action: CLOSE

