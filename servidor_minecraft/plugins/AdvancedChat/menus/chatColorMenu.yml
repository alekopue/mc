      material: IRON_BLOCK
      lore:
        - '&f&lDale efecto negrita a tu texto.'
    italic:
      format: "<italic>%message%</italic>"
      name: "&f&oItalic&r"
      material: GOLD_BLOCK
      lore:
        - '&f&oDale efecto italic a tus textos.'
    underline:
      format: "<underlined>%message%</underlined>"
