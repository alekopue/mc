title: '&eClans list'
height: 6
fill-borders: true # Default true

sort-by: [
  "&9LEVEL",
  "&bMEMBERS",
  "&6COINS",
  "&cKILLS"
]

items:

  clan-action:
    name: "{clan_name} &7({clan_type})"
    item: GRAY_BANNER
    slot: BACKGROUND # Don't change this
    lore:
      - ""
      - "&7Clan leader: &a{clan_leader}"
      - "&7Clan members: &b{clan_members}&f/{clan_members_max}"
      - ""
      - "&7Clan level: &9{clan_level} ⭐"
      - "&7Clan Tag: {clan_tag}"
      - "&7Clan K/D: &a{clan_kills}&f/&c{clan_deaths} &7({clan_kdr}) ⚔"
      - ""
      - "&7Clan coins: &6{clan_coins} ⛃"
      - ""
      - "&7Clan Multiplier"
      - "   &7XP: &9x{clan_multiplier_xp}"
      - "   &7Money: &ex{clan_multiplier_money}"
      - ""
      - "&aClick to join this clan"
    click:
      left: JOIN_CLAN
      right: JOIN_CLAN

  sort-clans:
    name: "&eSort"
    item: OAK_SIGN
    slot: 49
    lore:
      - ""
      - "&a> Left click to sort by: {sort}"
      - "&c> Right click to reset the sort"
    click:
      left: SORT_CLANS
      right: SORT_RESET

