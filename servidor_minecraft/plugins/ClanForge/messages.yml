version: 3.0.3 # Don't change this

# Support HEX colors: <#RRGGBB>, <##RRGGBB>, &x&R&G&B&R&G&B, §x§R§G§B§R§G§B, &#RRGGBB

clan-max-level: "&c&lMAX"
gui-storage-title: "{clanName} &8| &eStorage"

clan-level-up:

  chat:
    - ""
    - "{center}&e&l&k!!!&r {clanName} &e&l&k!!!"
    - "{center}&bLevel up to &e&l{level}&r&b!"
    - ""

  title: "{clanName}"
  sub-title: "&7{oldLevel} ≫ &9{newLevel} ⭐"

clan-create: [
  "{prefix} &aClan {clanName} &ahas been created!",
  "&eENTER CLAN NAME IN CHAT",
  "&aNew Clan",
  "&a⇙ &fEnter the name of your clan &a⇘",
  "{prefix} &cClan creation cancelled!",
  "{clanName}",
  "&aClan created!"
]

new-clan-create:
  message: |

    &c&l╔═══════════════╗
    
      &fType the clan name in the chat
      &fTo cancel&r <click:cancel>
    
    &c&l╚═══════════════╝
  clickable:
    cancel:
      text: "&c[click here]"
      hover: "&cClick to cancel clan creation"

invitation:
  message: |

    &a&l╔═══════════════╗
    
      &fYou have been invited to the clan {clanName}
    
      <click:accept> &r&7━&r <click:deny>
    
    &a&l╚═══════════════╝
  clickable:
    accept:
      text: "&a&lACCEPT"
      hover: "&aClick to accept the invitation"
    deny:
      text: "&c&lDENY"
      hover: "&cClick to decline the invitation"

