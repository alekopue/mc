admin:
  clan-info:
    - "&8&m----------------------------------------"
    - "&6&lClan Information: {clan_name}"
    - "&8&m----------------------------------------"
    - "&6Clan CID: &f{clan_cid}"
    - "{clan_tag}"
    - "&6Creation Date: &f{clan_created}"
    - "&6Level: &f{clan_level}"
    - "&6Experience: &f{clan_experience}"
    - "&6Coins: &f{clan_coins}"
    - ""
    - "&6Settings:"
    - "  &7Private: &f{clan_type}"
    - "  &7PvP: &f{clan_pvp}"
    - ""
    - "&6Perks:"
    - "  &7XP Multiplier: &fx{perk_xp_multiplier}"
    - "  &7Money Multiplier: &fx{perk_money_multiplier}"
    - "  &7Maximum Bases: &f{perk_max_bases}"
    - "  &7Maximum Members: &f{perk_max_members}"
    - "  &7Tag: &f{perk_tag}"
    - "  &7MOTD: &f{perk_motd}"
    - "  &7Storage Size: &f{perk_storage_size}"
    - ""
    - "&6Bases &7({base_count}/{perk_max_bases}):"
    - "{bases_list}"
    - ""
    - "{motd_section}"
    - ""
    - "&6Members &7({member_count}/{perk_max_members}):"
    - "{leader_section}"
    - "{officers_section}"
    - "{members_section}"
    - "&8&m----------------------------------------"

  clan-info-tag: "&6Tag: {clan_tag}"
  clan-info-no-bases: "  &7No bases in the clan"
  clan-info-base-item: "  &7• &f{base_name} &7({world}, {x}, {y}, {z})"
  clan-info-motd-header: "&6MOTD:"
  clan-info-motd-item: "  &7{index}. &f{motdText}"
  clan-info-leader: "  &c• &fLeader: {player_name} &7(XP: {player_xp}, J: {player_joined}) {online_status}"
  clan-info-officers-header: "  &6Officers:"
  clan-info-officer-item: "    &6• &f{player_name} &7(XP: {player_xp}, J: {player_joined}) {online_status}"
  clan-info-members-header: "  &7Members:"
  clan-info-member-item: "    &7• &f{player_name} &7(XP: {player_xp}, J: {player_joined}) {online_status}"

  clan-delete:
    success: "{prefix} &aClan '{clan_name}' has been successfully deleted!"
    notify-members: "{prefix} &cYour clan has been deleted by an administrator!"
  clan-rename:
    success: "{prefix} &aClan renamed from '{oldName}&a' to '{newClanName}&a' successfully!"
    error: "&cA clan with the name '{newClanName}&c' already exists!"
  clan-set-level:
    success: "{prefix} &aYou set the level of clan '{clan_name}&a' to &f{level}"
    invalid-level: "{prefix} &cLevel must be a positive number!"
    max-level: "{prefix} &cMaximum clan level is: {maxLevel}"
    incorrect-level: "{prefix} &cInvalid level! Please enter an integer"
  clan-coins:
    error:
      invalid-amount-positive: "{prefix} &cAmount must be a positive number!"
      invalid-amount-integer: "{prefix} &cInvalid amount! Please enter an integer."
    add:
      success: "{prefix} &aYou added &6{coins} coins &ato the clan {clan_name}&a!"
    set:
      success: "{prefix} &aYou set the clan '{clan_name}&a' balance to &6{coins} coins&a!"
    take:
      success: "{prefix} &aYou took &6{coins} coins &afrom the clan {clan_name}&a!"
      not-enough-coins: "{prefix} &cThe clan does not have enough money! Current balance: &6{coins} coins"
  clan-xp:
    add:
      success: "{prefix} &aYou added &9{xp} XP &ato the clan {clan_name}&a!"
    take:
      success: "{prefix} &aYou took &9{xp} XP &afrom the clan {clan_name}&a!"
      not-enough-xp: "{prefix} &cThe clan does not have enough XP! Current XP: &9{xp} XP"
  clan-tag:
    error:
      no-perk: "{prefix} &cThis clan does not have the perk unlocked!"
    set:
      success: "{prefix} &aYou have set the clan tag {tag} for {clan_name}"
    reset:
      success: "{prefix} &aYou have reset the clan tag for {clan_name}"

  clan-base:
    list:
      - "&6=== Clan Bases '{clan_name}&6' ==="
      - "&7Total Bases: &f{base_count} &7/ &f{perk_max_bases}"
      - "{bases_list}"
    item:
      - "&a{index}. &f{base_name}"
      - "   &7World: &f{world}"
      - "   &7Coordinates: &f{x}, {y}, {z}"
      - ""

    success-teleport: "{prefix} &aYou have been teleported to the base '{base_name}' of clan '{clan_name}'!"
    success-delete: "{prefix} &aBase '{base_name}' successfully deleted from clan '{clan_name}'!"
    not-found: "{prefix} &cBase with the name '{base_name}' not found in clan '{clan_name}'!"
    world-not-found: "{prefix} &cWorld for base '{base_name}' not found! The world might have been deleted."
    no-bases: "{prefix} &cClan '{clan_name}' has no bases."
    error: "{prefix} &cFailed to delete base '{base_name}' from clan '{clan_name}'!"

  help-cmd:
    - "&e/clan admin info <clan> &7- Detailed clan information"
    - "&e/clan admin storage <clan> &7- View clan storage"
    - "&e/clan admin delete <clan> &7- Delete a clan"
    - "&e/clan admin rename <clan> <new_name> &7- Rename a clan"
    - "&e/clan admin setlevel <clan> <level> &7- Set clan level"
    - "&e/clan admin tag <clan> <tag/reset> &7- Set clan tag or reset"
    - "&e/clan admin coins add <clan> <amount> &7- Add money to a clan"
    - "&e/clan admin coins set <clan> <amount> &7- Set clan balance"
    - "&e/clan admin coins take <clan> <amount> &7- Take money from a clan"
    - "&e/clan admin xp add <clan> <amount> &7- Add XP to a clan"
    - "&e/clan admin xp take <clan> <amount> &7- Take XP from a clan"
    - "&e/clan admin base list <clan> &7- List all clan bases"
    - "&e/clan admin base teleport <clan> <base> &7- Teleport to a clan base"
    - "&e/clan admin base delete <clan> <base> &7- Delete a clan base"

  help-header: "&8« &6Clan: Admin Commands &8»"
  help-footer: "&8« {prev_page} &7| &6Page {page}/{total} &7| {next_page} &8»"
  help-prev-page: "&7← Back"
  help-next-page: "&7Forward →"
  help-prev-page-command: "&eClick to go to the previous page"
  help-next-page-command: "&eClick to go to the next page"
  error-command: "&cUnknown command! Use /clan admin help for assistance"